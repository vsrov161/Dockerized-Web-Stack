services:
  nginx:
    build: ./nginx
    ports:
      - "80:80"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - webnet

  app:
    build: ./app
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      DB_NAME: mydb
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - webnet

  db:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: mydb
    volumes:
      - db_data:/var/lib/mysql
      - ./.my.cnf:/etc/mysql/conf.d/my.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    networks:
      - webnet

  backup:
    image: mysql:8.0
    volumes:
      - ./backups:/backups
      - ./.my.cnf:/etc/mysql/conf.d/my.cnf:ro
    environment:
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    command: >
      sh -c "
        while true; do
          mysqldump -h db mydb > /backups/backup_$$(date +\%Y\%m\%d_\%H\%M\%S).sql &&
          find /backups -name 'backup_*.sql' -mtime +7 -delete &&
          sleep 86400
        done
      "
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - webnet

volumes:
  db_data:

networks:
  webnet:
    driver: bridge