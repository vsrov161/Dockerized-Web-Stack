server {
    listen 80;
    server_name localhost;

    # Всё, что приходит на nginx, проксируется в контейнер web.
    # "web" резолвится docker-овским встроенным DNS по имени сервиса
    # из docker-compose.yml — отдельная сеть настраивать не нужно,
    # compose уже кладёт все сервисы в общую bridge-сеть проекта.
    location / {
        proxy_pass http://web:5000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}