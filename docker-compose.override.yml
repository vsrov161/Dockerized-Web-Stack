# docker-compose.override.yml
#
# Compose подхватывает этот файл АВТОМАТИЧЕСКИ, если он лежит рядом
# с docker-compose.yml и вы запускаете просто `docker compose up`.
# Ничего указывать в команде не нужно — merge происходит сам.
#
# Здесь описаны только dev-специфичные добавки поверх основного файла:
# они накладываются на базовый docker-compose.yml, а не заменяют его.

services:
  web:
    volumes:
      # Пробрасываем исходники с хоста поверх того, что уже
      # скопировано в образ через COPY. Теперь редактирование
      # app.py на хосте сразу видно внутри контейнера — без ребилда.
      - ./:/app
    environment:
      FLASK_DEBUG: "1"
    ports:
      # В dev удобно иметь прямой доступ к Flask в обход nginx —
      # например, чтобы смотреть полный traceback в debug-режиме
      # (nginx такие ошибки будет заворачивать в свой 502).
      - "5000:5000"