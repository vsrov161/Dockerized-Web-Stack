services:
  nginx:
    image: nginx:1.27-alpine
    container_name: devops-demo-nginx
    ports:
      - "8080:80"          # Единственный порт, торчащий наружу
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: devops-demo-web
    # ports НЕ публикуем — контейнер доступен только внутри сети compose,
    # по имени сервиса "web" и порту 5000. Снаружи хоста его не видно.
    expose:
      - "5000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: devops-demo-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # ports тоже не публикуем — доступ к MySQL только изнутри сети,
    # по имени сервиса "db" и порту 3306
    expose:
      - "3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db_data: